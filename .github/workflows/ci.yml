name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore FlashSaleFinder.sln
      - run: dotnet build FlashSaleFinder.sln --configuration Release --no-restore
      - run: dotnet test FlashSaleFinder.sln --configuration Release --no-build
